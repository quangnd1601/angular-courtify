<header class="fixed top-0 w-full max-w-[480px] z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant">
  <div class="w-full">
    <div class="flex justify-between items-center px-4 h-14">
      <div class="flex items-center gap-2"><button
          (click)="menuClick.emit()" class="material-symbols-outlined text-on-surface-variant p-2 rounded-full active:bg-surface-container-high">menu</button>
        <a routerLink="/" class="flex items-center cursor-pointer">
          <img src="images/logo-courtify.png" alt="COURTIFY" class="h-20 ml-[-16px] object-contain">
        </a>
      </div>
      <div class="flex items-center gap-1">
        <button routerLink="/courts"
          class="material-symbols-outlined text-on-surface-variant p-2 rounded-full active:bg-surface-container-high">search</button>
        <div class="relative">
          <button
            class="material-symbols-outlined text-on-surface-variant p-2 rounded-full active:bg-surface-container-high">shopping_cart</button>
          <span
            class="absolute top-1.5 right-1.5 bg-error text-white text-[8px] font-bold w-4 h-4 flex items-center justify-center rounded-full border-2 border-surface">2</span>
        </div>
      </div>
    </div>
  </div>
</header>
