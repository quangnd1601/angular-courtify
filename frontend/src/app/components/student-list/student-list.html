<div class="container">
  <h1>Danh Sách Sinh Viên - Lập Trình Web</h1>
  <table>
    <thead>
      <tr>
        <th>STT</th>
        <th>Họ tên</th>
        <th>Giới tính</th>
        <th>Điểm</th>
        <th>Kết quả</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of students">
        <td (click)="handleDetele(student.id)">{{ student.id }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.gender }}</td>
        <td [style.color]="student.score < 5 ? 'red' : 'green'">{{ student.score }}</td>
        <td>{{ student.passed ? 'Đậu' : 'Rớt' }}</td>
      </tr>
    </tbody>
  </table>
  Tổng Điểm: {{ totalPrice }}
</div>
